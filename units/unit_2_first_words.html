<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Darija</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <div class="quiz">

    <h1 id="question">
      How do you say<br>"hello" in Darija?
    </h1>

    <div class="answers">

      <button class="answer" data-answer="salam">
        <span class="arabic">سلام</span>
        <span class="latin">salam</span>
      </button>

      <button class="answer" data-answer="shukran">
        <span class="arabic">شكرا</span>
        <span class="latin">shukran</span>
      </button>

      <button class="answer" data-answer="bslama">
        <span class="arabic">بسلامة</span>
        <span class="latin">bslama</span>
      </button>

      <button class="answer" data-answer="fin">
        <span class="arabic">فين</span>
        <span class="latin">fin</span>
      </button>

    </div>

    <p id="feedback">Select the correct answer</p>

    <button id="continue-btn" hidden>Continue</button>

  </div>

  <script src="../script.js"></script>

</body>

</html>
